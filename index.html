<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css" integrity="sha512-DxV+EoADOkOygM4IR9yXP8Sb2qwgidEmeqAEmDKIOfPRQZOWbXCzLC6vjbZyy0vPisbH2SyW27+ddLVCN+OMzQ==" crossorigin="anonymous" referrerpolicy="no-referrer" />
   <!--internal styling-->
   <style>
    *{
        margin: 0;
        padding: 0;
        font-family: sans-serif;
        box-sizing: border-box;
    }
    /*navber*/
    .navbar{
        position: fixed;
        z-index: 1;
        top:0;
        left: 0;
        background-color:black;
        color: white;
        width: 100%;
        display: flex;
        justify-content: space-between;
        flex-wrap: wrap;
        align-items: center;
        padding-left: 10px;
    }
    /* unoder_List*/
    .navbar ul{
        height: 100%;
        list-style-type: none;
        display: flex;
    }
    /* list items padding*/
    .navbar li{
        padding: 15px 12px;
    }/* anchor tag*/
    .navbar a{
        text-decoration: none;
        color: white;
        text-align: center;
        text-transform: capitalize;
    }
    /*section tag content*/
    section{
        position: relative;
        height: 100vh;
        font-size: 30px;
        padding:  50px 20px 10px 20px;
        text-transform: capitalize;
        transition: all 1s ease-in-out 0.5s;
        border: 2px solid transparent;
        text-align: center;
    }
    /*hovering effect*/
    .navbar li:hover{
        background-color: rgb(91, 90, 90);
        transition: all 0.9s ease 0.1s;
    }
    /*menu bar*/
    .menu{
        display: none;
    }
    /*Rwsponsiveness when display maxwide 768px*/
    @media(max-width:768px){
        .navbar{
            height: 50px;
            padding-right: 10px;
        }
        .logo{
            font-size: 0.8rem;
        }
         .navbar ul{
            display: none;
            position: fixed;
            top: 50px;
            right: 0;
            left: 0;
            background-color: rgb(0,0,0,0.8);


        }
        .navbar .nav-link.active{
         display: block;
        }
        .menu{
            display: block;
    
        }
        #cross{
            display: none;
        }
        #cross.active{
            display: flex;
        }
        .menu #bar.active{
            display: none;
        }
    }
    </style>
</head>
<body>
<!--nav bar-->
    <nav class="navbar">
        <div class="logo">
            <h2>LOGO</h2>
        </div>
        <!--menu bar-->
        <ul class="nav-link">
            <li><a href="#home">home</a></li>
            <li><a href="#services" >services</a></li>
            <li><a href="#about" >about</a></li>
            <li><a href="#contact" >contact</a></li>
        </ul>
        <!--menu bar logos and actions-->
        <div class="menu" onclick="toggle()">
            <i class="fa-solid fa-bars" id="bar"></i>
            <i class="fa-solid fa-xmark" id="cross"></i>
        </div>
    </nav>
    <div class="section">
    <section id ="home" style="background-color: aqua;">home</section>
    <section id = "services" style="background-color: blue;">services</section>
    <section id ="about" style="background-color: rgb(243, 97, 13);">about</section>
    <section id = "contact" style="background-color: rgb(245, 6, 6);">contact</section>
    </div>
</body>
<!--ADD js for dynamic respone-->
<script>
    let navlink = document.querySelector(".nav-link");
    let cross = document.querySelector("#cross");
    let menu = document.querySelector("#bar")
    function toggle() {
        navlink.classList.toggle('active')
        cross.classList.toggle('active')
        menu.classList.toggle('active')
    }
</script>
</html>
